<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Sample — Toyota</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', 'Tajawal', Arial, sans-serif;
            font-size: 12px;
            background: #f3f3f3;
            color: #181818;
            padding: 24px 16px 48px;
        }
        .page-wrap {
            max-width: 1100px;
            margin: 0 auto;
        }
        .page-title {
            font-size: 18px;
            font-weight: 700;
            color: #181818;
            margin-bottom: 16px;
        }

        /* CRM section panel */
        .crm-section {
            border: 1px solid #c9c9c9;
            border-radius: 4px;
            background: #fff;
            box-shadow: 0 2px 2px rgba(0,0,0,.05);
        }
        .crm-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(180deg, #f0f8fc 0%, #e5f3fa 100%);
            border-bottom: 1px solid #c9c9c9;
            padding: 8px 12px;
            min-height: 40px;
        }
        .crm-section-header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 13px;
            color: #181818;
        }
        .crm-chevron {
            width: 16px; height: 16px;
            color: #0176d3;
            font-size: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .crm-edit {
            width: 18px; height: 18px;
            border: 1px solid #c9c9c9;
            border-radius: 3px;
            background: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #0176d3;
            cursor: pointer;
        }
        .crm-minimize {
            width: 20px; height: 20px;
            border: none;
            background: transparent;
            color: #747474;
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
        }

        .crm-section-body {
            padding: 12px 16px 16px;
        }
        .crm-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 32px;
        }
        @media (max-width: 768px) {
            .crm-columns { grid-template-columns: 1fr; gap: 0; }
        }

        .crm-field {
            display: grid;
            grid-template-columns: minmax(140px, 42%) 1fr;
            gap: 8px;
            align-items: baseline;
            padding: 6px 0;
            border-bottom: 1px solid transparent;
        }
        .crm-field:hover {
            background: #fafafa;
        }
        .crm-label {
            color: #444;
            font-size: 12px;
            line-height: 1.35;
            text-align: right;
            padding-left: 4px;
        }
        .crm-label[dir="rtl"] {
            text-align: right;
        }
        .crm-value {
            min-height: 18px;
            color: #181818;
            font-size: 12px;
            border-bottom: 1px dotted #ccc;
            padding-bottom: 2px;
        }
        .crm-value.empty {
            color: transparent;
            min-height: 16px;
        }
        .crm-checkbox {
            width: 14px;
            height: 14px;
            border: 1px solid #747474;
            border-radius: 2px;
            background: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            vertical-align: middle;
            font-size: 10px;
            color: #fff;
        }
        .crm-checkbox.checked {
            background: #0176d3;
            border-color: #0176d3;
        }
    </style>
</head>
<body>
    <div class="page-wrap">
        <h1 class="page-title">CRM Sample</h1>

        <section class="crm-section">
            <header class="crm-section-header">
                <div class="crm-section-header-left">
                    <span class="crm-chevron" title="Collapse">▼</span>
                    <span>Sales Order Information</span>
                    <span class="crm-edit" title="Edit">✎</span>
                </div>
                <button type="button" class="crm-minimize" title="Minimize">−</button>
            </header>

            <div class="crm-section-body">
                <div class="crm-columns">
                    <div class="crm-col" id="colLeft"></div>
                    <div class="crm-col" id="colRight"></div>
                </div>
            </div>
        </section>
    </div>

    <script>
        const FIELDS = [
            'تاريخ',
            'Sales Order No. رقم الطلب',
            'رقم الشاسية',
            'Product',
            'PIC',
            'Sales Type',
            'Invoice owner',
            'User Name',
            'S/A',
            'تاريخ إرسال الضيف',
            'تاريخ استلام التواقيع من الضيف',
            'تاريخ ارسال الملف للحسابات submission date',
            'تاريخ استلام موافقة الحسابات',
            'Current vin 1502 Tele sales',
            'GT',
            'Vehicle Location',
            'الحالة Status',
            'ملف المرور',
            'السداد Traffic fees',
            'التأمين insurance',
            'تاريخ اصدار الاستماره registration date',
            'الملاحظات Remarks',
            'مدينة الترحيل',
            'مسؤول التمويل',
            'تاريخ امر التسليم',
            'طريقة البيع',
            'مكان البيع',
            'رقم الجوال Mobile'
        ];

        const SAMPLE_VALUES = [
            '6/24/2026',
            '3019596833',
            'JTMABBBJ0T4230697',
            'LC300',
            'Rasha',
            'Bank',
            'SAUDI NATIONAL BANK',
            'Sattam Ayed S Alshammari',
            'Maryam Salah Abdulrahman Tabakh',
            '6/25/2026',
            '6/25/2026',
            '6/25/2026',
            '6/25/2026',
            'no',
            '7022',
            '7022/#',
            'b.PSFU',
            'yes',
            'yes',
            'yes',
            '6/28/2026',
            '',
            'الرياض',
            '',
            '',
            '',
            '',
            '0501262281'
        ];

        const CHECKBOX_FIELDS = new Set([
            'ملف المرور',
            'السداد Traffic fees',
            'التأمين insurance'
        ]);

        function isRtlLabel(label) {
            return /[\u0600-\u06FF]/.test(label);
        }

        function renderField(label, value, index) {
            const rtl = isRtlLabel(label);
            const useCheckbox = CHECKBOX_FIELDS.has(label);
            const v = String(value ?? '').trim();
            let valueHtml;
            if (useCheckbox) {
                const checked = /^yes$/i.test(v);
                valueHtml = `<span class="crm-checkbox${checked ? ' checked' : ''}" aria-hidden="true">${checked ? '✓' : ''}</span>`;
            } else if (v) {
                valueHtml = `<span class="crm-value" ${/[\u0600-\u06FF]/.test(v) ? 'dir="rtl"' : ''}>${v}</span>`;
            } else {
                valueHtml = '<span class="crm-value empty">&nbsp;</span>';
            }
            return `<div class="crm-field">
                <div class="crm-label" ${rtl ? 'dir="rtl"' : ''}>${label}:</div>
                <div>${valueHtml}</div>
            </div>`;
        }

        const mid = Math.ceil(FIELDS.length / 2);

        document.getElementById('colLeft').innerHTML = FIELDS.slice(0, mid)
            .map((label, i) => renderField(label, SAMPLE_VALUES[i], i)).join('');
        document.getElementById('colRight').innerHTML = FIELDS.slice(mid)
            .map((label, i) => renderField(label, SAMPLE_VALUES[i + mid], i + mid)).join('');
    </script>
</body>
</html>
