<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SNB Preview - Logo Only Panel</title>
  <style>
    :root {
      --bg: #f3f5f8;
      --card: #ffffff;
      --line: #e6e9ef;
      --text: #222;
      --muted: #6b7280;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      color: var(--text);
      padding: 18px;
    }

    .top-bar {
      max-width: 1320px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .title {
      font-weight: 800;
      font-size: clamp(18px, 2.2vw, 28px);
    }
    .back {
      border: 0;
      border-radius: 10px;
      background: #111827;
      color: #fff;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 14px;
    }

    .frame {
      max-width: 1320px;
      margin: 0 auto;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--line);
      box-shadow: 0 20px 36px rgba(0,0,0,.08);
      background: #fff;
    }

    .banner {
      height: 120px;
      background: linear-gradient(180deg, #202124 0%, #2f3338 100%);
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 14px 22px;
      color: #fff;
      font-size: clamp(24px, 3vw, 44px);
      font-weight: 800;
    }

    .content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      min-height: 520px;
      direction: ltr;
    }

    .left-panel {
      background: linear-gradient(160deg, #8fbf12 0%, #2e7b4f 70%, #1d5d66 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      border-inline-end: 1px solid rgba(255,255,255,.18);
      padding: 30px;
    }

    .logo-shell {
      width: 260px;
      height: 260px;
      border-radius: 20px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.28);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.1);
    }

    .logo-shell img {
      max-width: 72%;
      max-height: 72%;
      object-fit: contain;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,.2));
    }

    .logo-fallback {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      background: #0b8a58;
      color: #fff;
      font-weight: 800;
      font-size: 52px;
    }

    .right-panel {
      padding: 34px 30px;
      background: var(--card);
      direction: rtl;
    }

    .calc-title {
      font-size: clamp(34px, 3vw, 50px);
      line-height: 1.2;
      font-weight: 300;
      margin: 8px 0 24px;
      text-align: center;
    }

    .field {
      display: grid;
      grid-template-columns: 170px 1fr;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
    }

    .input {
      border: 1px solid #d0d6dd;
      border-radius: 999px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6b7280;
      font-size: 14px;
    }

    .label {
      color: #374151;
      font-size: 18px;
      text-align: right;
    }

    .hint {
      margin-top: 16px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <button class="back" id="backBtn" type="button">رجوع</button>
    <div class="title">Preview - Logo Only Left Panel</div>
  </div>

  <section class="frame">
    <div class="banner">حاسبة التمويل</div>
    <div class="content">
      <div class="left-panel">
        <div class="logo-shell">
          <img
            id="snbLogo"
            src="images/banks/SNB bank.png"
            alt="SNB Logo"
            onerror="this.style.display='none';document.getElementById('snbFallback').style.display='flex';"
          />
          <div class="logo-fallback" id="snbFallback">S</div>
        </div>
      </div>
      <div class="right-panel">
        <div class="calc-title">حاسبة التمويل التأجيري<br>للسيارات</div>
        <div class="field">
          <div class="input">0 SR</div>
          <div class="label">سعر السيارة</div>
        </div>
        <div class="field">
          <div class="input">0 %</div>
          <div class="label">الدفعة الأولية</div>
        </div>
        <div class="field">
          <div class="input">0 %</div>
          <div class="label">الدفعة الأخيرة</div>
        </div>
        <div class="hint">هذه معاينة محلية للشكل فقط (لرؤية لوحة الشعار فقط في اليسار).</div>
      </div>
    </div>
  </section>

  <script>
    const IDLE_TIMEOUT_MS = 120000;
    const HOME_PAGE = "simple-app.html";
    document.getElementById("backBtn").addEventListener("click", () => {
      window.location.href = HOME_PAGE;
    });
    let idleTimer = null;
    const resetIdleTimer = () => {
      if (idleTimer) clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        window.location.href = HOME_PAGE;
      }, IDLE_TIMEOUT_MS);
    };
    ["click", "touchstart", "touchmove", "keydown", "mousemove", "scroll"].forEach((evt) => {
      window.addEventListener(evt, resetIdleTimer, { passive: true });
    });
    resetIdleTimer();
  </script>
</body>
</html>
